<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>재건동이 — 관리자 로그</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --border:rgba(11,11,11,.10); --accent:#2a78d6; --critical:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,.10); --accent:#3987e5;
  }
}
*{box-sizing:border-box}
body{
  margin:0;font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  background:var(--page);color:var(--ink);padding:20px;line-height:1.5;
}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:1.2rem;margin:0 0 4px}
p.sub{color:var(--muted);font-size:.85rem;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);font:inherit;
  font-size:.9rem;font-weight:700;cursor:pointer;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.uid-box{font-size:.78rem;color:var(--muted);word-break:break-all;background:var(--page);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:800;position:sticky;top:0;background:var(--surface)}
td.mono{font-family:ui-monospace,monospace;font-size:.72rem;white-space:pre-wrap;word-break:break-all;color:var(--ink2);max-width:360px}
.tbl-scroll{overflow-x:auto;max-height:75vh;overflow-y:auto;border:1px solid var(--border);border-radius:12px}
.err{color:var(--critical);font-size:.85rem;white-space:pre-wrap}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔒 재건동이 — 관리자 전용 사용 로그</h1>
  <p class="sub">GitHub 로그인 후 허용된 계정만 조회할 수 있습니다. (URL을 안다고 데이터가 보이지 않음 — Firestore 보안 규칙으로 차단)</p>

  <div class="card" id="login-card">
    <button class="btn primary" id="btn-login">GitHub으로 로그인</button>
    <p class="err hidden" id="login-err"></p>
  </div>

  <div class="card hidden" id="user-card">
    <p>로그인: <b id="user-name"></b> (<span id="user-email"></span>)</p>
    <p class="sub" style="margin:6px 0 0">최초 설정 시 이 UID를 보내주시면 접근 권한을 이 계정으로 고정합니다:</p>
    <div class="uid-box" id="user-uid"></div>
    <div style="margin-top:10px"><button class="btn" id="btn-logout">로그아웃</button></div>
  </div>

  <div class="card hidden" id="logs-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b>최근 로그 (최대 300건)</b>
      <button class="btn" id="btn-refresh">새로고침</button>
    </div>
    <p class="err hidden" id="logs-err"></p>
    <div class="tbl-scroll">
      <table>
        <thead><tr><th>시각</th><th>종류</th><th>입력</th><th>결과</th></tr></thead>
        <tbody id="logs-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
"use strict";
const cfg = window.FIREBASE_CONFIG;
if(!cfg || !cfg.apiKey || cfg.apiKey === "REPLACE_ME"){
  document.getElementById("login-err").textContent =
    "firebase-config.js에 실제 설정값이 아직 없습니다. dongne/firebase-config.js를 채워주세요.";
  document.getElementById("login-err").classList.remove("hidden");
}else{
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const provider = new firebase.auth.GithubAuthProvider();

  const esc = s => String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const fmtJson = v => { try{ return JSON.stringify(v, null, 1); }catch(e){ return String(v); } };

  document.getElementById("btn-login").onclick = () => {
    document.getElementById("login-err").classList.add("hidden");
    auth.signInWithPopup(provider).catch(e=>{
      document.getElementById("login-err").textContent = "로그인 실패: " + e.message;
      document.getElementById("login-err").classList.remove("hidden");
    });
  };
  document.getElementById("btn-logout").onclick = () => auth.signOut();
  document.getElementById("btn-refresh").onclick = () => loadLogs();

  async function loadLogs(){
    const body = document.getElementById("logs-body");
    const err = document.getElementById("logs-err");
    err.classList.add("hidden");
    body.innerHTML = `<tr><td colspan="4">불러오는 중…</td></tr>`;
    try{
      const snap = await db.collection("logs").orderBy("ts","desc").limit(300).get();
      if(snap.empty){ body.innerHTML = `<tr><td colspan="4">로그가 아직 없습니다.</td></tr>`; return; }
      body.innerHTML = snap.docs.map(doc=>{
        const d = doc.data();
        const ts = d.ts && d.ts.toDate ? d.ts.toDate().toLocaleString("ko-KR") : "";
        return `<tr>
          <td>${esc(ts)}</td>
          <td>${esc(d.type)}</td>
          <td class="mono">${esc(fmtJson(d.payload?.input))}</td>
          <td class="mono">${esc(fmtJson(d.payload?.result || d.payload))}</td>
        </tr>`;
      }).join("");
    }catch(e){
      body.innerHTML = "";
      err.textContent = "조회 실패 (권한이 없거나 Firestore 규칙 설정 전일 수 있습니다): " + e.message;
      err.classList.remove("hidden");
    }
  }

  auth.onAuthStateChanged(user=>{
    document.getElementById("login-card").classList.toggle("hidden", !!user);
    document.getElementById("user-card").classList.toggle("hidden", !user);
    document.getElementById("logs-card").classList.toggle("hidden", !user);
    if(user){
      document.getElementById("user-name").textContent = user.displayName || user.uid;
      document.getElementById("user-email").textContent = user.email || "(이메일 비공개)";
      document.getElementById("user-uid").textContent = "UID: " + user.uid;
      loadLogs();
    }
  });
}
</script>
</body>
</html>
