name: 동네분석 데이터 자동 갱신

on:
  schedule:
    - cron: "0 21 1 * *"   # 매월 2일 06:00 KST
  workflow_dispatch: {}     # Actions 탭에서 수동 실행도 가능
  push:                     # 대상 동네/스크립트가 바뀌면 즉시 갱신
    branches:
      - claude/automate-news-posting-ChKWt   # 기본 브랜치
    paths:
      - "dongne/targets.json"
      - "dongne/fetch_data.py"
      - ".github/workflows/dongne-auto.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 지역 인덱스 생성/보충 (누락된 시/도만, 매번 자동으로 이어서 채움)
        continue-on-error: true   # 실패해도 아래 매월 핵심 갱신 단계는 계속 진행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "::error::리포지토리 Settings → Secrets and variables → Actions 에 DATA_GO_KR_KEY 를 등록하세요 (data.go.kr 인증키)"
            exit 1
          fi
          python dongne/fetch_data.py --build-region-index

      - name: 공공데이터 조회
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python dongne/fetch_data.py --config dongne/targets.json

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dongne/output/auto.json dongne/output/region_index.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(dongne): 공공데이터 자동 갱신 $(date +%Y-%m-%d)"
            git push
          fi
