name: 동네분석 앱 배포 (GitHub Pages)

on:
  push:
    branches:
      - claude/automate-news-posting-ChKWt   # 기본 브랜치
    paths:
      - "dongne/**"
      - ".github/workflows/dongne-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages Source가 "GitHub Actions"로 설정된 뒤 재실행됨
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dongne

      - id: deployment
        uses: actions/deploy-pages@v4
