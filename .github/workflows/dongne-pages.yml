name: 동네분석 앱 배포 (GitHub Pages)

on:
  push:
    branches:
      - claude/automate-news-posting-ChKWt   # 기본 브랜치
    paths:
      - "dongne/**"
      - ".github/workflows/dongne-pages.yml"
  workflow_run:
    # dongne-auto.yml이 봇 계정으로 auto.json을 커밋·push하면 그 push는
    # GitHub 정책상 위 push 트리거를 만들지 않으므로, 완료 이벤트로 이어서 실행한다.
    workflows: ["동네분석 데이터 자동 갱신"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 이벤트의 head_sha는 dongne-auto.yml이 "시작될 때" 커밋을 가리켜서,
          # 그 실행 도중 봇이 새로 커밋한 auto.json/region_index.json이 빠진다.
          # 항상 브랜치 최신 커밋을 받도록 고정 브랜치명을 명시한다.
          ref: claude/automate-news-posting-ChKWt

      # Pages Source가 "GitHub Actions"로 설정된 뒤 재실행됨
      - uses: actions/configure-pages@v5

      # config.template.js의 자리표시자를 실제 키로 치환해 배포본에만 주입한다.
      # (레포/git 이력에는 키가 남지 않음 — 배포된 정적 페이지에는 여전히 노출되니
      #  dongne/README.md의 "API 키 노출" 안내 참고)
      - name: 배포용 빌드 (API 키 주입)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          rm -rf _site_build
          cp -r dongne _site_build
          rm -f _site_build/config.template.js
          sed "s|__DATA_GO_KR_KEY__|${DATA_GO_KR_KEY}|" dongne/config.template.js > _site_build/config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_build

      - id: deployment
        uses: actions/deploy-pages@v4
